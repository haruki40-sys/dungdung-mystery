<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7fa">
  <title>CASE 001 · 달빛 악보 실종사건</title>
  <link rel="stylesheet" href="style.css?v=09">
</head>
<body data-scene="intro">
  <a class="skip-link" href="#story">본문으로 바로가기</a>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="사건 파일 처음으로">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>
          <span class="eyebrow">MOONLIGHT MYSTERY FILE</span>
          <strong>CASE 001</strong>
        </span>
      </a>

      <div class="top-actions" aria-label="게임 메뉴">
        <button id="notebookBtn" class="tool-button" type="button">
          <span aria-hidden="true">▤</span>
          <span>탐정수첩</span>
          <b id="clueCount">0/24</b>
        </button>
        <button id="suspectBtn" class="tool-button" type="button">
          <span aria-hidden="true">♙</span>
          <span>용의자</span>
        </button>
        <button id="statusBtn" class="tool-button" type="button">
          <span class="save-dot" aria-hidden="true">●</span>
          <span>수사현황</span>
          <b id="statusBadge">대기</b>
        </button>
        <button id="timelineBtn" class="tool-button" type="button">
          <span aria-hidden="true">◷</span>
          <span>시간표</span>
        </button>
        <button id="resetBtn" class="tool-button tool-button--reset" type="button">
          <span aria-hidden="true">↺</span>
          <span>처음부터</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="game-stage" aria-live="polite">
        <div id="sceneVisual" class="scene-visual">
          <div class="scene-visual__shade"></div>
          <div class="scene-visual__content">
            <span id="chapterLabel" class="chapter-label">사건 브리핑</span>
            <p id="sceneKicker">THURSDAY · 21:10</p>
            <h1 id="sceneTitle">비 내리는 밤,<br>마지막 악보가 사라졌다.</h1>
            <span id="sceneLocation" class="scene-location">산속 음악회장 · 문라이트 하우스</span>
          </div>
          <div id="hotspotLayer" class="hotspot-layer" aria-label="조사 지점"></div>
        </div>

        <div class="story-sheet">
          <article id="story" class="story-card"></article>
          <div id="choices" class="choices" aria-label="행동 선택"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>MOONLIGHT MYSTERY · CASE FILE 001</span>
      <span>Bright Moonlight prototype v0.9</span>
    </footer>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="상세 정보">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="닫기">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="game.js?v=09"></script>
</body>
</html>
