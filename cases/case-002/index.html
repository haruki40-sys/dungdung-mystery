<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f7fa">
  <link rel="icon" href="data:,">
  <title>CASE 002 · 봉인된 심사표</title>
  <link rel="stylesheet" href="engine/mystery-ui.css?v=021-20260929">
</head>
<body data-layout="intro">
  <a class="skip-link" href="#story">본문으로 바로가기</a>
  <div class="app-shell">
    <header class="topbar">
      <a id="brandLink" class="brand" href="#" aria-label="사건 첫 화면으로">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><span id="brandEyebrow" class="eyebrow">MYSTERY FILE</span><strong id="brandCase">SAMPLE</strong></span>
      </a>
      <nav class="top-actions" aria-label="게임 메뉴">
        <button id="notebookBtn" class="tool-button" type="button">▤ 탐정수첩 <b id="clueCount">0/0</b></button>
        <button id="suspectBtn" class="tool-button" type="button">♟ 용의자</button>
        <button id="statusBtn" class="tool-button" type="button"><span class="save-dot">●</span> 수사현황 <b id="statusBadge">대기</b></button>
        <button id="timelineBtn" class="tool-button" type="button">◷ 시간표</button>
        <button id="resetBtn" class="tool-button tool-button--reset" type="button">↻ 처음부터</button>
      </nav>
    </header>
    <nav aria-label="사건 선택" style="padding:12px 20px;text-align:center"><a href="../../" style="color:#173f5f;font-weight:700">← CASE 001 달빛 악보 실종사건</a></nav>
    <main class="layout">
      <section class="game-stage" aria-live="polite">
        <div id="sceneVisual" class="scene-visual">
          <div class="scene-visual__shade"></div>
          <div class="scene-visual__content">
            <span id="chapterLabel" class="chapter-label">사건 브리핑</span>
            <p id="sceneKicker">MYSTERY FILE</p>
            <h1 id="sceneTitle">사건 제목</h1>
            <span id="sceneLocation" class="scene-location"></span>
          </div>
          <div id="hotspotLayer" class="hotspot-layer" aria-label="조사 지점"></div>
        </div>
        <div class="story-sheet">
          <article id="story" class="story-card"></article>
          <div id="choices" class="choices" aria-label="행동 선택"></div>
        </div>
      </section>
    </main>
    <footer class="footer"><span id="footerCase"></span><span id="footerVersion"></span></footer>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="상세 정보">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="닫기">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <script src="case-data.js?v=021-20260929"></script>
  <script src="engine/mystery-engine.js?v=021-20260929"></script>
</body>
</html>
